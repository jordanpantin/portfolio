name: Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la nouvelle image Docker'
        required: true

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          TAG="$(echo "${{ github.event.inputs.version }}" | tr -d ' \t\n\r')"
          if [ -z "$TAG" ]; then
            echo "No version input supplied. The 'version' input is required for manual runs." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/jordanpantin/portfolio:${{ steps.tag.outputs.tag }}
            docker.io/jordanpantin/portfolio:latest

      - name: Image pushed
        run: |
          echo "Pushed: docker.io/jordanpantin/portfolio:${{ steps.tag.outputs.tag }} and latest"
